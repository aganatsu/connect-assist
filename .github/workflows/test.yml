name: Tests

# Runs the Deno suite on every pull request and push to main.
#
# WHY THIS EXISTS: 1,561 tests under supabase/functions/ had never run. The
# documented command was `deno test supabase/tests/`, which covers 568 — so a
# whole tranche three times larger was invisible. Nine had drifted red without
# anyone knowing, including six on break-even stop placement.
#
# Both paths are listed explicitly rather than pointing at `supabase/`, so
# adding a third location is a deliberate act rather than something that
# silently does not run.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deno:
    runs-on: ubuntu-latest
    # A bound, so a future genuine hang FAILS instead of merely looking like
    # this one did. `supabase/tests` took 502s on 2026-09-22 and was read as a
    # hang, because a step that prints nothing for eight minutes and a step that
    # is wedged are indistinguishable from the outside. With --parallel the
    # whole job runs in a few minutes; 15 gives generous headroom and still
    # turns a real deadlock into a red run within the quarter hour.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x

      # --parallel runs test FILES concurrently across the runner's cores. Deno
      # is sequential by default, so one heavy file blocks every other file.
      #
      # WHY IT MATTERS HERE: five IPO files are ~95% of the runtime, and the
      # heaviest is deliberately O(n²) — ipoPaperLifecycle drives the real
      # runner bar by bar, re-running the whole series at each bar, because
      # that is precisely what it is proving. Sequentially the other 124 files
      # queue behind it for nothing.
      #
      # This changes SCHEDULING, not coverage: 1,285 and 1,569 tests before and
      # after, verified across three repeat runs. Nothing is skipped, filtered
      # or given a shorter series. If a count in a future run is lower than
      # these, something was dropped — look there first.
      - name: Tests — supabase/tests
        run: deno test --parallel --no-check --allow-read --allow-net --allow-env supabase/tests/

      - name: Tests — supabase/functions
        run: deno test --parallel --no-check --allow-read --allow-net --allow-env supabase/functions/

      - name: Type check every edge function
        # --no-check above keeps the suite fast; this is the pass that would
        # otherwise never happen. All 21 are clean as of 2026-09-15.
        run: |
          set -euo pipefail
          for f in supabase/functions/*/index.ts; do
            echo "::group::$(basename "$(dirname "$f")")"
            deno check "$f"
            echo "::endgroup::"
          done

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Vitest
        # The frontend DOES have a suite — 22 tests — and this comment used to
        # say it did not, so none of them ran on any PR. Same shape as the
        # 1,561 Deno tests that sat unrun under supabase/functions until
        # 2026-09-15.
        run: npm run test
      - name: Build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: build-only-placeholder
        run: npm run build
